name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci.db
      JWT_SECRET_KEY: ci-only-test-secret
      PAYMENTS_MODE: mock
      AI_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -c "from pathlib import Path; Path('/tmp/backend-requirements.txt').write_text(Path('requirements.txt').read_text(encoding='utf-16'), encoding='utf-8')"
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/backend-requirements.txt
      - name: Run backend tests
        run: python -m pytest -q
